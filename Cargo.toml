[workspace]
resolver = "2"
members = [
    "crates/storage",
    "crates/crdt",
    "crates/raft",
    "crates/proto",
    "crates/server",
    "benches",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
bytes = "1"
tokio = { version = "1", features = ["full"] }
tonic = "0.12"
prost = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
crc32fast = "1"
proptest = "1"
tempfile = "3"
parking_lot = "0.12"
